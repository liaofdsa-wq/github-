<script>
'use strict';
const chapterTitles=['環境與本機版本庫','版本時光機','分支與合併','GitHub 雲端同步','PR 與互相審查'];
const lessons=[
// chapter, title, goal, before, after, beforeNote, afterNote, steps, expected, tip
[0,'先確認電腦已有 Git','這次分享直接從小烏龜開始，Git 安裝只做快速確認。','install0','install1','開始前先看一下環境。','Git for Windows 已可用，可以接著裝 TortoiseGit。',['這裡不重講 Git 安裝，先假設大家都已經裝好。','在開始功能表搜尋 Git Bash；找得到就可以繼續。','若真的找不到，再另外補裝 Git for Windows。'],'開始功能表找得到 Git Bash。','Git 與 GitHub 是不同的東西；這裡確認的是電腦上的 Git。'],
[0,'安裝 TortoiseGit 與繁中語言包','把 Git 操作放進 Windows 檔案總管右鍵選單。','install1','install2','Git 已存在，接著補上圖形操作介面。','右鍵選單有 TortoiseGit，介面也可切成繁體中文。',['開啟下方官方下載頁，依自己的 Windows 系統選擇安裝程式。','在同一頁找到繁體中文語言包（zh_TW），選擇相同位元版本安裝。','右鍵 → TortoiseGit → Settings → General，Language 選「中文（繁體）」後套用。','在資料夾空白處按右鍵，確認 TortoiseGit 選單出現。'],'右鍵選單能找到 TortoiseGit，設定中可選繁體中文。','Windows 11 常需先按「顯示其他選項」才看得到完整右鍵選單。'],
[0,'建立本機版本庫','讓一個普通資料夾開始記錄版本。','folder','repo','只是一個普通資料夾。','資料夾內建立 .git 管理資料（尚無 Commit）。',['在檔案總管建立 Git 練習資料夾。','在資料夾空白處按右鍵，選「Git 在此建立版本庫／Git Create repository here」。','確認建立成功；不要勾選建立純版本庫（Bare）。'],'練習資料夾已成為本機 Git Repository。','不要直接在已經包含其他 Git 專案的上層資料夾初始化。'],
[0,'第一次 Commit','把 123.txt 正式存進歷史，並統一主分支名稱為 main。','repo','one','版本庫建立了，但還沒有歷史節點。','main 有第一個 Commit，記錄 123.txt 的第一版。',['建立 123.txt，內容輸入「123」。','右鍵 → Git 提交（Commit），勾選 123.txt，填寫「新增 123」後提交。','提交後確認目前分支名稱；若是 master，開 TortoiseGit → Browse References。','在 refs/heads 對 master 按右鍵重新命名為 main。'],'顯示日誌裡有第一個 Commit，而且目前分支名稱是 main。','不同電腦的 Git 預設分支可能是 main 或 master；這裡先統一成 main。'],
[1,'修改 123.txt','先改變工作資料夾，觀察尚未提交的狀態。','one','draft','上一版已經 Commit。','檔案有變更，但尚未新增 Commit。',['打開 123.txt，將內容從「123」改成「123123」。','儲存檔案。','先不要 Commit，觀察檔案圖示或檢查修改清單。'],'能分辨「修改檔案」與「建立 Commit」是兩件事。','只儲存檔案，不會自動產生 Git 歷史版本。'],
[1,'第二次 Commit','把 123123 寫成新的歷史節點。','draft','two','工作區有未提交修改。','main 向前增加一個 Commit。',['右鍵 → Git 提交（Commit）→ main。','檢查修改清單，輸入訊息「更新 123 第二版」。','按提交完成。'],'main 現在至少有兩筆 Commit。','Commit 在本機完成，不代表已經上傳 GitHub。'],
[1,'開啟提交歷史','用小烏龜看懂一條版本時間線。','two','two','已經有兩次提交。','顯示日誌列出兩筆 Commit 與檔案修改紀錄。',['右鍵 → TortoiseGit → 顯示日誌（Show log）。','找到第一次與第二次 Commit。','確認每筆紀錄有提交訊息、日期、作者。'],'能指出「第一版」和「第二版」各是哪一個 Commit。','「顯示日誌」和「版本分支圖」都是視覺化歷史工具，呈現方式不同。'],
[1,'比較兩個版本','知道 Git 保存的不是只有最新版。','two','diff','同一檔案已存在兩個版本。','差異視窗標示新增、移除或修改的文字。',['開啟「顯示日誌」。','選取兩個 Commit 並使用「比較版本」（Compare revisions）。','查看 123.txt 的「123」與「123123」差異。'],'能說出第二版相較第一版多了什麼。','顏色通常代表新增與刪除，不是檔案本身的格式。'],
[1,'開啟舊版檔案','不更動現在的檔案，直接觀看第一版。','two','old','工作資料夾仍是第二版。','開啟歷史第一版的快照；現有第二版不變。',['在「顯示日誌」選擇第一版 Commit。','在下方檔案清單找到 123.txt。','右鍵開啟該版內容，或另存該版本。'],'能看到內容「123」，而目前資料夾的「123123」仍在。','若想保留原檔，優先用「開啟／另存歷史版本」，不要用 Reset。'],
[1,'恢復歷史檔案','了解把舊內容帶回工作區，和刪除歷史不同。','two','restore','目前檔案內容是 123123。','工作區內容可恢復成 123；舊 Commit 仍存在。',['在「顯示日誌」找到第一版及 123.txt。','在下方檔案清單對 123.txt 按右鍵，選「Revert changes to this revision／還原變更至此版本」。','看完結果後可 Commit，或把這次變更取消，讓下一步從乾淨工作區開始。'],'「恢復檔案」不會刪掉第二版的 Commit。','不要用「Reset → Hard」處理單一檔案；那會影響整個工作區。'],
[2,'建立 feature 分支','從 main 的現有提交位置開出新分支。','two','branch','目前只有 main 的歷史指標。','多一個 feature 標籤，兩分支暫時指向同個 Commit。',['確定目前工作區沒有待處理的修改。','右鍵 → TortoiseGit → 建立分支（Create Branch）。','名稱輸入 feature，起點使用目前 main；這一步先不要勾「Switch to new branch/tag」。','確認建立。'],'本機出現 feature 分支，但目前仍在 main。','建立分支不會立刻分叉；兩個標籤一開始指向同一個 Commit。'],
[2,'切換到 feature','讓目前工作資料夾進入新分支。','branch','checkout','feature 已建立，但可能尚未切過去。','HEAD 現在位於 feature（檔案未必立刻改變）。',['右鍵 → TortoiseGit → 切換／檢出（Switch/Checkout）。','在分支清單選 feature。','確認切換完成。'],'目前分支顯示 feature。','工作區有未提交修改時，切換可能會被阻擋；先確認狀態。'],
[2,'在 feature Commit','只讓個人分支向前發展。','checkout','feature','main 與 feature 尚在同個 Commit。','feature 多出一個 Commit，main 仍指向舊節點。',['在 feature 分支修改 123.txt，加入一行「feature 修改」。','右鍵 → Git 提交（Commit）→ feature。','填寫訊息並完成提交。'],'feature 具有 main 尚未擁有的修改。','feature 比 main 多 Commit，不代表圖上一定畫成兩條線。'],
[2,'切換回 main，確認檔案變化','切回 main 後，比對工作區內容和 feature 有什麼不同。','feature','mainreturn','目前在 feature，123.txt 含有 feature 的修改。','HEAD 回到 main；feature 專屬內容不會出現在 main 的工作區。',['右鍵 → TortoiseGit → 切換／檢出（Switch/Checkout）。','選 main 並確認。','打開 123.txt，確認 feature 加入的那一行現在看不到。'],'目前分支是 main；feature 的 Commit 仍然存在。','切換分支只是在工作區呈現另一段歷史，不會刪除 feature。'],
[2,'在 main 也 Commit','讓 main 和 feature 真正形成兩條不同歷史。','mainreturn','diverged','feature 已向前，main 停在共同祖先。','main 也新增自己的 Commit，因此兩分支真正分叉。',['保持在 main 分支。','新增另一個檔案 main-note.txt，避免和 feature 修改相同位置。','使用 Git 提交建立「main 的獨立修改」。'],'版本圖出現兩條不同的 Commit 歷史。','兩條分支各有不同 Commit，才有歷史上的真正分叉。'],
[2,'合併 feature 到 main','把 feature 的成果整合進目前 main。','diverged','merged','main 和 feature 各自有新的 Commit。','在 main 合併 feature，形成一個明確的 Merge Commit。',['確認目前所在分支是 main，且工作區乾淨。','右鍵 → TortoiseGit → 合併（Merge），來源分支選 feature。','勾選「No Fast Forward」，再開始合併。','完成後確認 123.txt 與 main-note.txt 都在。'],'main 包含兩邊的修改，版本線上也出現 Merge 節點。','No Fast Forward 會保留合併節點；若發生衝突，先處理並標記已解決。'],

     svg=`${label(18,25,'GitHub 上的 main',purple)}${label(18,67,'本機記住的遠端狀態','#8faeff')}${label(18,82,'origin/main','#8faeff')}${label(18,123,'目前本機 main／工作檔案',green)}${path('M170 23 H392',purple)}${n(230,23,purple)}${n(300,23,purple)}${n(382,23,gold,8)}${label(382,11,'新 Commit D',gold,'end')}${path('M170 72 H392','#8faeff')}${n(230,72,'#8faeff')}${n(300,72,'#8faeff')}${n(382,72,gold,8)}${path('M382 35 V60',gold,'',true)}${label(357,55,'Fetch',gold,'end')}${path('M170 118 H310',green)}${n(230,118,green)}${n(300,118,green)}${label(300,106,'舊版 C',green,'middle')}${label(210,153,'知道遠端更新，但工作檔案不變',gold,'middle')}`;
    }else{
     svg=`${label(18,25,'GitHub 上的 main',purple)}${label(18,67,'本機記住的遠端狀態','#8faeff')}${label(18,82,'origin/main','#8faeff')}${label(18,123,'目前本機 main／工作檔案',green)}${path('M170 23 H392',purple)}${n(230,23,purple)}${n(300,23,purple)}${n(382,23,purple)}${path('M170 72 H392','#8faeff')}${n(230,72,'#8faeff')}${n(300,72,'#8faeff')}${n(382,72,'#8faeff')}${path('M170 118 H392',green)}${n(230,118,green)}${n(300,118,green)}${n(382,118,gold,8)}${path('M382 84 V106',gold,'',true)}${label(357,103,'Pull',gold,'end')}${label(210,153,'main 與工作檔案都更新到 D',green,'middle')}`;
    }
   } else if(['teampush','pr','approved','teammerged'].includes(state)){
    svg+=path('M35 60 H367',main)+n(54,60)+n(129,60)+n(341,60,main)+label(343,45,'main',main);
    svg+=path('M129 60 C157 60 151 119 194 119 H339',green)+n(210,119,green)+n(339,119,green)+label(340,148,'feature/你的代號',green,'end');
    if(state==='teampush')svg+=`<rect x="201" y="94" width="153" height="40" rx="9" fill="none" stroke="${purple}" stroke-width="1.5"/>`+label(286,89,'GitHub 已有分支',purple,'middle');
    if(state==='pr'||state==='approved')svg+=path('M339 111 Q402 82 341 63',purple,'5 5')+label(270,22,state==='pr'?'PR：請求合併':'✓ Approve（還沒 Merge）',purple,'middle');
    if(state==='teammerged')svg+=path('M339 119 Q377 119 383 60',green)+n(383,60,gold,9)+label(375,22,'Merge ✓',gold,'end');
   } else if(state==='network'){
    svg+=`<rect x="18" y="9" width="384" height="142" rx="12" fill="#111d2d" stroke="#446785"/><rect x="18" y="9" width="384" height="30" rx="12" fill="#1c2b3d"/><rect x="18" y="28" width="384" height="11" fill="#1c2b3d"/>`+label(36,29,'GitHub Repository','#e8f3ff')+label(310,29,'Insights','#75bcff')+label(376,29,'Network',gold,'end');
    svg+=path('M42 71 H372',main)+n(56,71,main)+n(128,71,main)+n(366,71,gold,8)+label(373,61,'main',main,'end');
    svg+=path('M128 71 C156 71 151 112 188 112 H310 C335 112 337 71 366 71',green)+n(202,112,green)+n(296,112,green)+label(264,139,'feature/你的代號',green,'middle')+label(366,49,'Merge Commit',gold,'end');
   }
  }
 return wrap(svg);
}
let active=-1;
const checked=new Set();
try{const stored=JSON.parse(localStorage.getItem('gitworkshop-checked-v1')||'[]');if(Array.isArray(stored))stored.forEach(n=>Number.isInteger(n)&&n>=0&&n<lessons.length&&checked.add(n));}catch(e){}
function save(){try{localStorage.setItem('gitworkshop-checked-v1',JSON.stringify([...checked]));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function vidName(i){return `videos/${pad(i+1)}_${['check-git','install-tortoisegit','init-repo','first-commit','edit-file','second-commit','show-log','compare-revisions','open-old-file','restore-file','create-branch','switch-branch','feature-commit','switch-main','main-commit','merge-branch','revision-graph','create-github-repo','set-origin','push-main','fetch','pull','clone-team','push-feature','create-pr','approve-pr','merge-pr','github-network-graph'][i]}.mp4`;}
const lessonLinks={1:[
 {label:'前往 TortoiseGit 官方下載頁',url:'https://tortoisegit.org/download/'}
]};
function renderNav(){
 document.querySelector('#sidebarNav').innerHTML=`<button type="button" class="nav ${active===-1?'active':''}" data-go="-1"><span class="num">00</span><span>介紹</span></button>`+chapterTitles.map((name,ch)=>`<div class="group-name">${pad(ch+1)} / ${name}</div>${lessons.map((l,i)=>l[0]!==ch?'':`<button type="button" class="nav ${i===active?'active':''}" data-go="${i}"><span class="num">${pad(i+1)}</span><span>${svgEscape(l[1])}</span>${checked.has(i)?'<span class="tick">✓</span>':''}</button>`).join('')}`).join('');
 const sel=document.querySelector('#mobileSelect');sel.innerHTML=`<option value="-1">00 · 介紹</option>`+lessons.map((l,i)=>`<option value="${i}">${pad(i+1)} · ${svgEscape(l[1])}</option>`).join('');sel.value=String(active);
 document.querySelector('#sideProgress').style.width=(checked.size/lessons.length*100)+'%';document.querySelector('#sideStat').textContent=`已看過 ${checked.size} / ${lessons.length} 步`;
}
function render(){
 const intro=document.querySelector('#intro');
 if(active===-1){intro.classList.remove('hidden');document.querySelector('#lesson').innerHTML='';renderNav();return;}
 intro.classList.add('hidden');
 const l=lessons[active];const [ch,title,goal,before,after,beforeNote,afterNote,steps,expected,tip]=l;
 const pathname=vidName(active);
 const resources=lessonLinks[active]||[];
 document.querySelector('#lesson').innerHTML=`<div class="lesson-head"><div><div class="phase">PART ${pad(ch+1)}　/　${svgEscape(chapterTitles[ch])}</div><h2 class="lesson-title">${pad(active+1)}. ${svgEscape(title)}</h2><p class="lesson-goal">${svgEscape(goal)}</p></div><div class="counter">步驟 <b>${active+1}</b> / ${lessons.length}</div></div>
 <div class="two"><article class="panel graph-panel"><div class="graph-label"><i class="swatch"></i>操作前</div><div class="graph-art">${graphFor(before)}</div><div class="graph-caption">${svgEscape(beforeNote)}</div></article><article class="panel graph-panel after"><div class="graph-label"><i class="swatch"></i>操作後 · 預期結果</div><div class="graph-art">${graphFor(after)}</div><div class="graph-caption">${svgEscape(afterNote)}</div></article></div>
 <div class="lesson-main"><article class="panel padded"><div class="overline">ACTION / 操作會長這樣</div><h3>操作順序</h3>${resources.length?`<div class="resource-links">${resources.map(r=>`<a class="resource-link" href="${r.url}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>${svgEscape(r.label)}</a>`).join('')}</div>`:''}<ol class="steps">${steps.map(s=>`<li>${svgEscape(s)}</li>`).join('')}</ol><div class="outcome"><span>✓</span><div><strong>看到這個結果</strong><br>${svgEscape(expected)}</div></div><div class="tip"><strong>注意：</strong>${svgEscape(tip)}</div></article>
 <aside class="panel padded video-section"><div class="label-row"><div class="overline" style="margin:0">VIDEO / 操作短片</div><span class="chip">預留位置</span></div><div class="video-placeholder" id="videoEmpty"><div class="play">▶</div><strong>這裡放操作短片</strong><span class="video-hint">檔名對上後，重新打開 HTML 即可</span></div><video class="video-player" id="videoPlayer" controls preload="metadata" playsinline></video><div class="videoname">${svgEscape(pathname)}</div></aside></div>
 <div class="foot"><label class="complete"><input type="checkbox" id="completed" ${checked.has(active)?'checked':''}/> 這一步我看過了</label><div class="actions"><button type="button" class="btn" id="prev">${active===0?'← 介紹':'← 上一步'}</button><button type="button" class="btn primary" id="next">${active===lessons.length-1?'回到介紹':'下一步 →'}</button></div></div>`;
 let video=document.querySelector('#videoPlayer'), empty=document.querySelector('#videoEmpty');
 // Browser video source probes will fail quietly when files are not present; preserve the placeholder.
 video.addEventListener('loadedmetadata',()=>{empty.style.display='none';video.style.display='block'},{once:true});
 video.addEventListener('error',()=>{video.style.display='none';empty.style.display='flex'},{once:true});
 video.src=pathname;
 document.querySelector('#completed').addEventListener('change',e=>{e.target.checked?checked.add(active):checked.delete(active);save();renderNav();});
 document.querySelector('#prev').addEventListener('click',()=>navigate(active-1));
 document.querySelector('#next').addEventListener('click',()=>navigate(active===lessons.length-1?-1:active+1));
 renderNav();
}
function navigate(index){if(index<-1||index>=lessons.length)return;active=index;render();document.querySelector(index===-1?'#intro':'#lesson').scrollIntoView({behavior:'instant',block:'start'});}
document.querySelector('#sidebarNav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)navigate(+b.dataset.go);});
document.querySelector('#mobileSelect').addEventListener('change',e=>navigate(+e.target.value));
document.querySelector('#introNext').addEventListener('click',()=>navigate(0));
const introVideo=document.querySelector('#introVideoPlayer'),introEmpty=document.querySelector('#introVideoEmpty');
introVideo.addEventListener('loadedmetadata',()=>{introEmpty.style.display='none';introVideo.style.display='block'},{once:true});
introVideo.addEventListener('error',()=>{introVideo.style.display='none';introEmpty.style.display='flex'},{once:true});
introVideo.src='videos/00_intro.mp4';
render();
</script>
</body></html>
